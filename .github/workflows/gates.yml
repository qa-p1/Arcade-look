name: Gates

# PLAN "Release" step 2: every exit gate against the published files of a release candidate, never a local build.
# Run it on the rc tag ("Use workflow from: v1.0.0-rc.N") once "Release" has published it; "Promote" only after a
# green run on the rc it promotes (docs/v1/DECISIONS.md D13). The shared gates (published files and manifest,
# conformance, N-1, budgets, the delta through Tools' updater, Windows and macOS smoke) are Link's app-gates.yml;
# Look adds its own Linux checks on the published AppImage and the Tier 2 desktop smoke.
on:
  workflow_dispatch:
    inputs:
      previous:
        description: The previous stable release (upgrade test, and the delta "from the previous release")
        default: v0.4.3

permissions:
  contents: read

concurrency:
  group: look-gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    uses: qa-p1/Arcade-Link/.github/workflows/app-gates.yml@v1.0.11
    with:
      app: arcade.look
      name: look
      previous: ${{ inputs.previous }}
      link-ref: v1.0.11
      linux-packages: >-
        libwebkit2gtk-4.1-0 libayatana-appindicator3-1 python3-dbus
        gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      # The packaged install/repair/uninstall smoke, close/reopen and Restart of the resident, the upgrade with a
      # user's data from the previous release, and the tray's lifecycle.
      linux-checks: |
        dbus-run-session -- xvfb-run -a python3 scripts/verify-appimage.py "$RC" arcade.look Arcade-Look.AppImage arcade-look
        dbus-run-session -- xvfb-run -a python3 scripts/verify-resident.py "$RC"
        python3 ../Arcade-Link/tools/e2e.py run -- python3 scripts/verify-upgrade.py "$PREVIOUS" "$RC"
        python3 ../Arcade-Link/tools/e2e.py run -- /usr/bin/python3 tests/tray-registration.py "$RC" "$(command -v arcade-link)" look
      windows-check: >-
        pwsh -NoProfile -File scripts/verify-nsis.ps1 -SetupPattern 'rc/*-setup.exe'
        -Id arcade.look -Name 'Arcade Look' -CliName arcade-look
      macos-check: scripts/verify-dmg.sh rc/*.dmg 'Arcade Look' arcade-look arcade.look

  # Tier 2 (sway, KWin, Mutter, X11) blocks on a crash or data loss.
  desktop-tier2:
    needs: gates
    uses: qa-p1/Arcade-Link/.github/workflows/desktop-tier2.yml@v1.0.11
    with:
      artifact: gate-appimage
      link-ref: v1.0.11
