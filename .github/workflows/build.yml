# Builds the installers for every OS. Called by ci.yml (every push to main: downloadable
# workflow artifacts) and release.yml (version tags: assets on the GitHub Release).
#
#   Windows  NSIS setup .exe (per-user, no admin). Its hooks set up the File Explorer
#            integration and start at login (src-tauri/windows/installer-hooks.nsh).
#   Linux    AppImage with GStreamer bundled for video/audio. Sets itself up on first launch.
#   macOS    Universal (Apple Silicon + Intel) .dmg. Sets itself up on first launch.
name: Build installers

on:
  workflow_call:
    inputs:
      release-tag:
        description: Also upload the installers to this GitHub Release (empty = artifacts only)
        type: string
        default: ''

jobs:
  bundle:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: arcade-look-windows-x64
            args: --bundles nsis
            files: src-tauri/target/release/bundle/nsis/*-setup.exe
          - name: Linux x86_64
            # The oldest supported runner keeps the AppImage working on older distributions (glibc).
            os: ubuntu-22.04
            artifact: arcade-look-linux-x86_64
            args: --bundles appimage
            files: src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macOS universal
            os: macos-latest
            artifact: arcade-look-macos-universal
            args: --target universal-apple-darwin --bundles dmg
            files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: bundle

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The AppImage bundler refuses to run without an appindicator library installed.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev file patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav

      - run: npm ci

      - name: Build installer
        run: npx tauri build --ci ${{ matrix.args }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Attach to release
        if: inputs.release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
        run: gh release upload "$TAG" ${{ matrix.files }} --clobber
