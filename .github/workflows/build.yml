# Builds the installers for every OS as workflow artifacts. Called by ci.yml for every push
# to main; release.yml then publishes them as a GitHub Release.
#
#   Windows  NSIS setup .exe (per-user, no admin). Its hooks set up the File Explorer
#            integration and start at login (src-tauri/windows/installer-hooks.nsh).
#   Linux    AppImage with GStreamer bundled for video/audio. Sets itself up on first launch.
#   macOS    Universal (Apple Silicon + Intel) .dmg. Sets itself up on first launch.
name: Build installers

on:
  workflow_call:

jobs:
  bundle:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: arcade-look-windows-x64
            args: --bundles nsis
            files: src-tauri/target/release/bundle/nsis/*-setup.exe
          - name: Linux x86_64
            # The oldest supported runner keeps the AppImage working on older distributions (glibc).
            os: ubuntu-22.04
            artifact: arcade-look-linux-x86_64
            args: --bundles appimage
            files: src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macOS universal
            os: macos-latest
            artifact: arcade-look-macos-universal
            args: --target universal-apple-darwin --bundles dmg
            files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: arcade-look
    env:
      CARGO_BUILD_JOBS: 3
      # rust-toolchain.toml pins the 1.88 MSRV for checks; installers build with
      # the toolchain below, and this override wins over that file.
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: arcade-look
      - name: Pinned Link runner for the isolated tray gate
        if: runner.os == 'Linux'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: qa-p1/Arcade-Link
          ref: v0.4.4
          path: Arcade-Link

      # The runner context isn't available in job-level env.
      - name: Keep Arcade registry writes in the runner's temp directory
        shell: bash
        run: echo "ARCADE_HOME=$RUNNER_TEMP/arcade-look-registry" >> "$GITHUB_ENV"


      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arcade-look/package-lock.json

      # Installers use pinned Rust 1.99.1: 1.88 with LTO drops
      # encoding_rs statics at link time. The Check job keeps the 1.88 MSRV.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.99.1
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            arcade-look/src-tauri
            ${{ runner.os == 'Linux' && 'Arcade-Link' || '' }}
          key: bundle
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The AppImage bundler refuses to run without an appindicator library installed.
          # dav1d (AVIF, LK-11) is built from source and linked statically: 22.04 ships 0.9, too old.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev meson nasm ninja-build \
            libssl-dev libayatana-appindicator3-dev file patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav xvfb dbus-x11 xdotool python3-dbus python3-gi

      - run: npm ci

      - name: Build installer
        env:
          SYSTEM_DEPS_DAV1D_BUILD_INTERNAL: always
        run: npx tauri build --ci ${{ matrix.args }} -- --locked

      - name: Verify AppImage install, repair and uninstall in a temporary profile
        if: runner.os == 'Linux'
        shell: bash
        run: dbus-run-session -- xvfb-run -a python3 scripts/verify-appimage.py src-tauri/target/release/bundle/appimage/*.AppImage arcade.look Arcade-Look.AppImage arcade-look

      # Close/reopen and explicit Restart must work in the shipping AppImage,
      # including the launcher environment used by its successor process.
      - name: Verify published AppImage close/reopen and Restart
        if: runner.os == 'Linux'
        shell: bash
        run: dbus-run-session -- xvfb-run -a python3 scripts/verify-resident.py src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Tray icon registration (real StatusNotifierWatcher, isolated)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The runner builds this debug CLI before executing the tray gate.
          /usr/bin/python3 "$GITHUB_WORKSPACE/Arcade-Link/tools/e2e.py" run -- /usr/bin/python3 tests/tray-registration.py src-tauri/target/release/arcade-look "$GITHUB_WORKSPACE/Arcade-Link/target/debug/arcade-link" look

      - name: Verify NSIS silent install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/verify-nsis.ps1 -SetupPattern 'src-tauri/target/release/bundle/nsis/*-setup.exe' -Id arcade.look -Name 'Arcade Look' -CliName arcade-look

      - name: Verify DMG silent install in a temporary home
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/verify-dmg.sh src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg 'Arcade Look' arcade-look arcade.look

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: arcade-look/${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
