name: CI

# Every pull request is checked. Every push to main is checked and then packaged: the
# installers for Windows, Linux and macOS are attached to the run as downloadable artifacts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: arcade-look
    env:
      CARGO_BUILD_JOBS: 3
      ARCADE_HOME: ${{ runner.temp }}/arcade-look-registry
    steps:
      - uses: actions/checkout@v4
        with:
          path: arcade-look

      - name: Check out the pinned Arcade Link source
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ARCADE_LINK_REPOSITORY || 'qa-p1/Arcade-link' }}
          ref: ${{ vars.ARCADE_LINK_REF || '1ae6ffbf7c75076772723f763a3d2da030207379' }}
          path: Arcade-link

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arcade-look/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: arcade-look/src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Check formatting
        if: runner.os == 'Linux'
        working-directory: arcade-look/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: arcade-look/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: arcade-look/src-tauri
        run: cargo test

  installers:
    name: Installers
    needs: check
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build.yml
