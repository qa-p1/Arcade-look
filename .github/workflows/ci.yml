name: CI

# Every pull request is checked. Every push to main is checked and then packaged: the
# installers for Windows, Linux and macOS are attached to the run as downloadable artifacts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: arcade-look
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v4
        with:
          path: arcade-look

      # The runner context isn't available in job-level env.
      - name: Keep Arcade registry writes in the runner's temp directory
        shell: bash
        run: echo "ARCADE_HOME=$RUNNER_TEMP/arcade-look-registry" >> "$GITHUB_ENV"


      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arcade-look/package-lock.json

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: arcade-look/src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Check formatting
        if: runner.os == 'Linux'
        working-directory: arcade-look/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: arcade-look/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Documentation, shortcuts and vendored sources
        run: python scripts/check-docs.py && python scripts/check-vendored.py

      - name: Tests
        working-directory: arcade-look/src-tauri
        run: python ../scripts/isolate.py cargo test --locked

  installers:
    name: Installers
    needs: check
    uses: ./.github/workflows/build.yml
