# Creates an annotated release-candidate tag (vX.Y.Z-rc.N) on a commit that is already on main, after checking it
# matches the app version, then starts "Release" on it, which builds every platform once and publishes a hidden
# prerelease on the test channel. Stable is never tagged here: "Promote" makes vX.Y.Z from a verified rc.
name: Tag a release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release candidate to create, e.g. v1.0.0-rc.1
        required: true
      sha:
        description: Full SHA of a commit on main
        required: true
permissions:
  contents: write
  actions: write
jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified with git ls-remote
        with:
          fetch-depth: 0
      - name: Validate and create the annotated tag
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc\.[1-9][0-9]*$ ]] || { echo "::error::Expected v1.2.3-rc.1"; exit 1; }
          base="${BASH_REMATCH[1]}"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected a full commit SHA"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main
          version=$(git show "$SHA:src-tauri/Cargo.toml" | python3 -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.read())["package"]["version"])')
          [ "$base" = "$version" ] || { echo "::error::Tag and app version differ"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" "$SHA" -m "Arcade Look $TAG"
          git push origin "refs/tags/$TAG"
      - name: Build and publish it on the test channel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
