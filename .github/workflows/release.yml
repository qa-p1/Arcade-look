# Push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to publish a release:
# a draft GitHub Release is created with the Windows, Linux and macOS installers attached.
# Review it and click "Publish". The tag must match "version" in src-tauri/tauri.conf.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in src-tauri/tauri.conf.json"
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
            --title "Arcade Look $GITHUB_REF_NAME" \
            --notes "$(cat <<'NOTES'
          ## Install

          | Platform | Download | Setup |
          |---|---|---|
          | **Windows 10/11** | `Arcade Look_*_x64-setup.exe` | Run it. Space in File Explorer, the *Quick Look* context menu and start at login are set up for you. |
          | **Linux** | `Arcade Look_*_amd64.AppImage` | `chmod +x` it, keep it somewhere permanent and run it once. It sets up GNOME Files (Space), Dolphin/Nemo (*Quick Look*), *Open With* and start on login. |
          | **macOS 10.15+** | `Arcade Look_*_universal.dmg` | Drag it to Applications and open it from there (right-click → Open the first time). Preview with Ctrl+Option+Space. |

          The builds are not code-signed yet, so Windows SmartScreen and macOS Gatekeeper ask for confirmation the first time.
          NOTES
          )"

  installers:
    name: Installers
    needs: draft
    uses: ./.github/workflows/build.yml
    with:
      release-tag: ${{ github.ref_name }}
