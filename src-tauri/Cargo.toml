[package]
name = "arcade-look"
version = "0.1.0"
description = "Universal Quick Look: select a file, press Space, see it instantly"
authors = ["Arcade Look contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.88"
default-run = "arcade-look"

[lib]
name = "arcade_look_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
base64 = "0.23"
percent-encoding = "2"
infer = "0.22"
encoding_rs = "0.8"
chardetng = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
quick-xml = "0.41"
csv = "1.3"
calamine = "0.36"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.6"
lzma-rust2 = "0.16"
ruzstd = "0.9"
sevenz-rust2 = { version = "0.20", default-features = false }
ttf-parser = "0.25"
lofty = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "tga", "dds", "hdr", "exr", "qoi", "pnm", "ff"] }
kamadak-exif = "0.6"
imagesize = "0.15"
# Arcade Link (the shared protocol). A relative path until Arcade-link has a
# tagged release; then a git dependency with a local [patch] override.
arcade-link = { path = "../../Arcade-link/crates/arcade-link", features = ["watch"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.4"

# Linux draws its tray icon over D-Bus with ksni instead (no libappindicator needed).
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }
gtk = "0.18"
ksni = { version = "0.3", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]

[features]
custom-protocol = ["tauri/custom-protocol"]
# Native webview automation, compiled only into isolated test binaries.
e2e = []

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 2
